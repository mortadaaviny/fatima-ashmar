<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فاطمة">
<title>فاطمة</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF; --ice:#F4F9FF; --ice2:#EAF3FF;
  --blue:#1E6FD9; --sky:#5BC0F8; --teal:#2EC4B6; --navy:#0B2545; --navy2:#13315C;
  --ink:#0B2545; --muted:#5B6B82; --line:rgba(30,111,217,.14);
  --red:#E5484D; --amber:#F5A524; --green:#22B07D;
  --glow:0 0 24px rgba(91,192,248,.55),0 0 60px rgba(30,111,217,.30);
  --card:rgba(255,255,255,.72);
  --r:22px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:clip;background:var(--ice);color:var(--ink)}
body{font-family:"Tajawal","Inter",system-ui,sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
html[lang=en] body{font-family:"Inter","Tajawal",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.num,.ltr{direction:ltr;unicode-bidi:isolate;font-family:"Inter",sans-serif}

/* ---------- animated glow background ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% 0%,#FFFFFF 0%,#F4F9FF 55%,#E7F1FF 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 22s ease-in-out infinite}
.b1{width:340px;height:340px;background:#5BC0F8;top:-90px;inset-inline-start:-80px}
.b2{width:300px;height:300px;background:#1E6FD9;opacity:.28;top:38%;inset-inline-end:-120px;animation-duration:28s;animation-delay:-6s}
.b3{width:260px;height:260px;background:#2EC4B6;opacity:.22;bottom:-80px;inset-inline-start:10%;animation-duration:32s;animation-delay:-12s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,30px) scale(1.08)}66%{transform:translate(-30px,50px) scale(.95)}}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(12px + var(--sat)) 16px calc(120px + var(--sab))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--navy)}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--sky);box-shadow:var(--glow);animation:breath 3.2s ease-in-out infinite}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);display:grid;place-items:center;cursor:pointer;transition:.25s}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px;stroke:var(--navy)}
.view{display:none}
.view.on{display:block;animation:viewIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:0 10px 30px rgba(11,37,69,.07),0 0 0 1px var(--line) inset;position:relative;overflow:hidden}
.card.glow{box-shadow:0 10px 30px rgba(11,37,69,.07),0 0 0 1px rgba(91,192,248,.35) inset,0 0 34px rgba(91,192,248,.25)}
.card h3{margin:0 0 8px;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:8px}
.card h3 .ic{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),var(--blue));box-shadow:0 0 14px rgba(91,192,248,.6)}
.card h3 .ic svg{width:16px;height:16px;stroke:#fff}
.muted{color:var(--muted);font-size:14px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{text-align:center;padding:14px 0 4px}
.photoWrap{position:relative;width:200px;height:200px;margin:8px auto 14px}
.halo{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(91,192,248,.55) 0%,rgba(30,111,217,.25) 45%,transparent 70%);animation:breath 4s ease-in-out infinite}
.ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#5BC0F8,#1E6FD9,#2EC4B6,#5BC0F8);animation:spin 9s linear infinite;filter:drop-shadow(0 0 12px rgba(91,192,248,.8))}
.photo{position:absolute;inset:0;border-radius:50%;background:#fff center/cover no-repeat;border:5px solid #fff;box-shadow:0 12px 40px rgba(11,37,69,.18)}
@keyframes breath{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.07);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.name{font-size:30px;font-weight:800;margin:0;background:linear-gradient(90deg,var(--navy),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.age{color:var(--blue);font-weight:600;margin-top:2px}
.hadith{margin:16px 4px 4px;padding:18px 18px 14px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(234,243,255,.9));border:1px solid rgba(91,192,248,.35);box-shadow:0 0 30px rgba(91,192,248,.22);position:relative}
.hadith .q{font-family:"Amiri","Tajawal",serif;font-size:20px;line-height:1.9;color:var(--navy);min-height:3.6em}
html[lang=en] .hadith .q{font-family:"Inter",sans-serif;font-size:16px;line-height:1.7;font-style:italic}
.hadith .who{margin-top:8px;font-size:14px;color:var(--blue);font-weight:700;opacity:0;transition:opacity .6s}
.hadith .who.on{opacity:1}
.hadith .src{font-weight:500;color:var(--muted)}
.hadith .nxt{position:absolute;top:10px;inset-inline-end:10px;width:30px;height:30px;border-radius:10px;border:0;background:transparent;cursor:pointer;opacity:.6}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--blue);vertical-align:-3px;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);backdrop-filter:blur(14px);border-radius:18px;padding:12px 10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:20px;color:var(--navy);font-family:"Inter",sans-serif}
.stat span{font-size:12px;color:var(--muted)}
.stat.good b{color:var(--green);text-shadow:0 0 14px rgba(34,176,125,.35)}
.stat.blue b{color:var(--blue);text-shadow:0 0 14px rgba(30,111,217,.35)}

/* ---------- analysis text ---------- */
.md p{margin:.3em 0}.md ul{margin:.3em 0;padding-inline-start:1.2em}.md li{margin:.2em 0}.md strong{color:var(--navy)}
.md h4{margin:.8em 0 .2em;font-size:15px;color:var(--blue)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 16px;font-weight:700;cursor:pointer;transition:transform .15s, box-shadow .3s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;box-shadow:0 6px 20px rgba(30,111,217,.35),0 0 24px rgba(91,192,248,.35)}
.btn.pri svg{stroke:#fff}
.btn.ghost{background:rgba(30,111,217,.08);color:var(--blue)}
.btn.ghost svg{stroke:var(--blue)}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.ghost .spin{border-color:rgba(30,111,217,.25);border-top-color:var(--blue)}

/* ---------- segmented ---------- */
.seg{display:flex;background:rgba(11,37,69,.06);border-radius:16px;padding:4px;margin:8px 0 6px;position:relative}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer;position:relative;z-index:1;transition:color .3s}
.seg button.on{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:12px;background:linear-gradient(135deg,var(--sky),var(--blue));box-shadow:0 0 18px rgba(91,192,248,.55);transition:all .4s cubic-bezier(.2,.8,.2,1)}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 4px}
.sectionHead h2{margin:0;font-size:22px;color:var(--navy)}

/* ---------- timeline ---------- */
.day{margin:18px 0 6px;position:relative}
.dayLabel{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);background:#fff;border-radius:999px;padding:6px 14px;border:1px solid var(--line);box-shadow:0 0 18px rgba(91,192,248,.18);font-size:14px}
.dayLabel .d{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--sky)}
.tl{position:relative;padding-inline-start:22px;margin-top:6px}
.tl:before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--sky),rgba(91,192,248,.1));border-radius:2px}
.ev{position:relative;margin:10px 0}
.ev:before{content:"";position:absolute;inset-inline-start:-20px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--blue));box-shadow:0 0 0 4px #fff,0 0 14px var(--c,var(--sky))}
.ev .card{margin:0;cursor:pointer;padding:14px}
.ev .top{display:flex;gap:10px;align-items:flex-start}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,#1E6FD9) 12%,white);color:var(--c,#1E6FD9);white-space:nowrap}
.ev .tt{font-weight:800;color:var(--navy);line-height:1.35}
.ev .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ev .sum{margin-top:8px;font-size:14.5px}
.ev .more{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ev.open .more{display:block;animation:viewIn .4s}
.box{border-radius:16px;padding:12px;margin:8px 0;font-size:14.5px}
.box.ai{background:linear-gradient(135deg,rgba(91,192,248,.12),rgba(30,111,217,.08));border:1px solid rgba(91,192,248,.35)}
.box.ai .lbl{color:var(--blue)}
.box.tx{background:rgba(11,37,69,.04);white-space:pre-wrap;max-height:320px;overflow:auto;font-size:13.5px}
.lbl{font-weight:800;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.thumbs a.file{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:rgba(30,111,217,.08);color:var(--blue);font-size:13px;text-decoration:none}
audio{width:100%;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}


.photoStage{position:relative;width:100%;display:flex;justify-content:center}
.waves{position:absolute;left:50%;top:50%;width:min(560px,100vw);height:240px;transform:translate(-50%,-50%);overflow:visible;pointer-events:none;z-index:0}
.waves path{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:0 13;filter:drop-shadow(0 0 4px rgba(91,192,248,.9))}
.waves .w1{stroke:url(#wg1);}
#v-home .waves .w1{stroke:url(#wg1b)}
.waves .w1{animation:dots 3s linear infinite}
.waves .w2{stroke:url(#wg2);}
#v-home .waves .w2{stroke:url(#wg2b)}
.waves .w2{stroke-width:4;stroke-dasharray:0 11;animation:dots 4s linear infinite reverse;opacity:.85}
@keyframes dots{to{stroke-dashoffset:-130}}
.photoWrap{z-index:1}
.editPhoto{position:absolute;bottom:6px;inset-inline-end:6px;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:linear-gradient(135deg,#5BC0F8,#1E6FD9);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 16px rgba(91,192,248,.7);z-index:3}
.editPhoto svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.splash .editPhoto{display:none}
/* animated gradients */
@property --ga{syntax:"<angle>";inherits:false;initial-value:0deg}
.bg{background:linear-gradient(160deg,#FFFFFF,#EEF6FF,#E3F0FF,#F2FBFF,#E6F7F5,#FFFFFF);background-size:300% 300%;animation:bgShift 18s ease-in-out infinite}
.splash{background:linear-gradient(160deg,#FFFFFF,#EAF4FF,#DCEBFF,#EFFAFF,#E3F6F3,#FFFFFF)!important;background-size:300% 300%!important;animation:bgShift 16s ease-in-out infinite}
@keyframes bgShift{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.name{background:linear-gradient(90deg,#0B2545,#1E6FD9,#5BC0F8,#1E6FD9,#0B2545);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:250% 0}}
.btn.pri,.hact .hi,.card h3 .ic,.fab,.recBig:not(.rec),.seg .pill,.opt.on,.editPhoto{background:linear-gradient(120deg,#5BC0F8,#1E6FD9,#2EC4B6,#5BC0F8);background-size:300% 300%;animation:gflow 7s ease infinite}
.recBig:not(.rec){animation:gflow 7s ease infinite}
@keyframes gflow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.ring{background:conic-gradient(from var(--ga),#5BC0F8,#1E6FD9,#2EC4B6,#7FD8FF,#5BC0F8);animation:ringA 5s linear infinite}
@keyframes ringA{to{--ga:360deg}}
/* photo editor */
.cropBox{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto;border-radius:50%;overflow:hidden;touch-action:none;background:#EAF3FF;box-shadow:0 0 0 4px #fff,0 0 30px rgba(91,192,248,.6);cursor:grab}
.cropBox canvas{width:100%;height:100%;display:block}
.zoomRow{display:flex;align-items:center;gap:10px;margin:14px 4px}
.zoomRow input{flex:1;accent-color:#1E6FD9}

/* ---------- chart ---------- */
.chart svg{width:100%;height:auto;overflow:visible}
.chart .ln{fill:none;stroke:url(#lg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(91,192,248,.8));stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.8s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .pt{fill:#fff;stroke:var(--blue);stroke-width:2.5}
.chart text{font-family:Inter,sans-serif;font-size:11px;fill:var(--muted)}
.chart .val{fill:var(--navy);font-weight:700;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 14px rgba(91,192,248,.55)}

/* ---------- forms ---------- */
label.f{display:block;margin:10px 0 4px;font-weight:700;font-size:14px;color:var(--navy)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid rgba(30,111,217,.22);background:#fff;border-radius:14px;padding:11px 12px;outline:none;transition:box-shadow .25s,border-color .25s}
.inp:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(91,192,248,.18),0 0 20px rgba(91,192,248,.25)}
textarea.inp{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.opt.on{background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(91,192,248,.5)}
.drop{display:block;border:2px dashed rgba(30,111,217,.3);border-radius:18px;padding:18px;text-align:center;color:var(--blue);background:rgba(234,243,255,.6);cursor:pointer;font-weight:700}
.drop input{display:none}
.filelist{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- alerts ---------- */
.alert{border-radius:18px;padding:14px;margin:12px 0;background:linear-gradient(135deg,#FFE9EA,#FFF4F4);border:1px solid rgba(229,72,77,.4);color:#8E1B1F;box-shadow:0 0 26px rgba(229,72,77,.25);animation:viewIn .4s}
.alert b{display:block;font-size:16px;margin-bottom:4px}
.alert .btn{margin-top:8px}
.note{font-size:12.5px;color:var(--muted);background:rgba(11,37,69,.04);border-radius:12px;padding:8px 10px;margin-top:10px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sab));width:min(92%,420px);height:72px;border-radius:28px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(91,192,248,.35);box-shadow:0 12px 36px rgba(11,37,69,.14),0 0 30px rgba(91,192,248,.30);display:flex;justify-content:space-around;align-items:center}
.nav button{position:relative;border:0;background:transparent;width:72px;height:60px;display:grid;place-items:center;cursor:pointer}
.nav svg{width:26px;height:26px;stroke:#0B2545;fill:none;stroke-width:1.8;transition:all .4s cubic-bezier(.2,.8,.2,1);opacity:.55}
.nav button[data-v=home] svg{width:28px;height:28px}
.nav button.on svg{stroke:#1E6FD9;fill:rgba(30,111,217,.92);transform:scale(1.22) translateY(-3px);opacity:1;filter:drop-shadow(0 0 6px #5BC0F8) drop-shadow(0 0 16px #1E6FD9)}
.nav button:after{content:"";position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:#5BC0F8;box-shadow:0 0 10px #5BC0F8,0 0 20px #1E6FD9;opacity:0;transform:scale(0);transition:.4s}
.nav button.on:after{opacity:1;transform:scale(1)}
.nav .navglow{position:absolute;top:50%;width:64px;height:64px;margin-top:-32px;border-radius:50%;background:radial-gradient(circle,rgba(91,192,248,.45),transparent 70%);transition:left .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}

/* ---------- chat fab ---------- */
.fab{position:fixed;z-index:21;bottom:calc(98px + var(--sab));inset-inline-end:max(16px,calc(50% - 264px));width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#5BC0F8,#1E6FD9);display:grid;place-items:center;box-shadow:0 8px 24px rgba(30,111,217,.45)}
.fab:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(91,192,248,.6);animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.fab svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.9}

/* ---------- sheets / modal ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(11,37,69,.35);backdrop-filter:blur(4px);animation:fade .3s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;background:linear-gradient(180deg,#FFFFFF,#F4F9FF);border-radius:28px 28px 0 0;box-shadow:0 -10px 50px rgba(11,37,69,.3),0 0 40px rgba(91,192,248,.25);display:flex;flex-direction:column;animation:up .45s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.panel .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;border-bottom:1px solid var(--line)}
.panel .ph h3{margin:0;font-size:18px;color:var(--navy)}
.panel .pb{padding:12px 18px 20px;overflow:auto;-webkit-overflow-scrolling:touch}
.grab{width:44px;height:5px;border-radius:5px;background:rgba(11,37,69,.15);margin:8px auto 0}

/* chat */
.chatPanel{height:92vh}
.msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.6;animation:viewIn .35s}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;border-end-end-radius:6px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-end-start-radius:6px;box-shadow:0 0 18px rgba(91,192,248,.15)}
.msg.a.md strong{color:var(--navy)}
.msg img{max-width:160px;border-radius:12px;display:block;margin-top:6px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--blue);font-weight:600}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px 12px;border-top:1px solid var(--line);background:#fff}
.composer textarea{flex:1;min-height:44px;max-height:120px;border-radius:16px;padding:10px 12px;border:1px solid rgba(30,111,217,.22);resize:none;outline:none}
.cbtn{width:44px;height:44px;border-radius:14px;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(30,111,217,.08);flex:none}
.cbtn svg{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:1.9}
.cbtn.send{background:linear-gradient(135deg,var(--sky),var(--blue));box-shadow:0 0 16px rgba(91,192,248,.5)}
.cbtn.send svg{stroke:#fff}
.cbtn.rec{background:var(--red);animation:breath 1.2s infinite}
.cbtn.rec svg{stroke:#fff}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sky);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(11,37,69,.92);display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex;animation:fade .25s}
.lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 0 40px rgba(91,192,248,.4)}

/* language splash */
.splash{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + var(--sat)) 22px calc(24px + var(--sab));background:radial-gradient(120% 80% at 50% 10%,#FFFFFF 0%,#F4F9FF 50%,#DDEBFF 100%);color:var(--navy);text-align:center;overflow:auto;transition:opacity .6s, transform .6s}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.langMini{position:absolute;top:calc(14px + var(--sat));inset-inline-end:14px;display:flex;gap:2px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 0 14px rgba(91,192,248,.2)}
.langMini button{border:0;background:transparent;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--muted);cursor:pointer}
.langMini button.on{background:var(--blue);color:#fff;box-shadow:0 0 10px rgba(91,192,248,.6)}
.splash .name{font-size:30px}
.splash .hadith{max-width:480px;width:100%;text-align:center}
.enterBtn{margin-top:6px;min-width:200px}
.home-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 6px}
.hact{border:1px solid rgba(91,192,248,.35);background:var(--card);backdrop-filter:blur(14px);border-radius:20px;padding:14px 6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:14.5px;box-shadow:0 8px 22px rgba(11,37,69,.06),0 0 20px rgba(91,192,248,.18);transition:transform .2s, box-shadow .3s}
.hact:active{transform:scale(.96)}
.hact .hi{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),var(--blue));box-shadow:0 0 18px rgba(91,192,248,.65)}
.hact .hi svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9}
.recWrap{text-align:center;padding:8px 0 4px}
.recBig{width:118px;height:118px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#5BC0F8,#1E6FD9);display:grid;place-items:center;margin:14px auto 10px;position:relative;box-shadow:0 10px 30px rgba(30,111,217,.45),0 0 40px rgba(91,192,248,.55)}
.recBig:before,.recBig:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(91,192,248,.55);animation:ping 2.4s ease-out infinite}
.recBig:after{animation-delay:1.2s}
.recBig svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:1.8}
.recBig.rec{background:linear-gradient(135deg,#FF6B6F,#E5484D);box-shadow:0 10px 30px rgba(229,72,77,.45),0 0 40px rgba(229,72,77,.5)}
.recBig.rec:before,.recBig.rec:after{border-color:rgba(229,72,77,.55)}
.recLbl{font-weight:800;color:var(--navy);font-size:17px}
.recTime{font-family:Inter,sans-serif;color:var(--red);font-weight:700;min-height:1.4em}
.orLine{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:12px 0}
.orLine:before,.orLine:after{content:"";flex:1;height:1px;background:var(--line)}
.view.swl{animation:swl .45s cubic-bezier(.2,.8,.2,1)}.view.swr{animation:swr .45s cubic-bezier(.2,.8,.2,1)}
@keyframes swl{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes swr{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

.splash.on{display:flex}
.splash .photoWrap{width:150px;height:150px}
.splash h1{margin:0;font-size:26px}
.splash p{margin:0;opacity:.8}
.langBtn{width:min(280px,80vw);padding:16px;border-radius:20px;border:1px solid rgba(91,192,248,.5);background:rgba(255,255,255,.06);color:#fff;font-size:20px;font-weight:800;cursor:pointer;transition:.3s;box-shadow:0 0 0 rgba(91,192,248,0)}
.langBtn:hover,.langBtn:active{background:linear-gradient(135deg,#5BC0F8,#1E6FD9);box-shadow:0 0 30px rgba(91,192,248,.7)}
.splash .stagger>*{opacity:0;transform:translateY(16px);animation:viewIn .7s forwards}
.splash .stagger>*:nth-child(2){animation-delay:.15s}.splash .stagger>*:nth-child(3){animation-delay:.3s}.splash .stagger>*:nth-child(4){animation-delay:.45s}.splash .stagger>*:nth-child(5){animation-delay:.6s}

.toast{position:fixed;z-index:90;left:50%;bottom:calc(100px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;opacity:0;transition:.35s;box-shadow:0 0 24px rgba(91,192,248,.4);font-size:14px;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}

.steps{counter-reset:s;padding:0;margin:8px 0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-inline-start:38px;margin:10px 0}
.steps li:before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 0 12px rgba(91,192,248,.6)}
.team li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.team{list-style:none;padding:0;margin:0}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

/* ---- performance: smooth on phones ---- */
.card,.stat,.hact{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(255,255,255,.86)}
.sheet .scrim{backdrop-filter:none!important}
.blob{will-change:transform;filter:blur(50px)}
.bg{animation:none!important;background:radial-gradient(120% 80% at 50% 0%,#FFFFFF 0%,#F4F9FF 55%,#E7F1FF 100%)!important}
.bg:after{content:"";position:absolute;inset:-20%;background:linear-gradient(120deg,rgba(91,192,248,.0),rgba(91,192,248,.14),rgba(46,196,182,.10),rgba(30,111,217,.0));will-change:transform;animation:sheen 16s ease-in-out infinite alternate}
@keyframes sheen{from{transform:translate3d(-12%,-6%,0) rotate(0deg)}to{transform:translate3d(12%,6%,0) rotate(8deg)}}
.splash{animation:none!important;background:radial-gradient(120% 80% at 50% 10%,#FFFFFF 0%,#F4F9FF 50%,#DDEBFF 100%)!important}
.waves path{filter:none!important}
.waves{will-change:transform}
.card h3 .ic,.hact .hi,.opt.on,.seg .pill,.editPhoto,.btn.pri{animation:none!important;background-size:100% 100%!important;background:linear-gradient(135deg,#5BC0F8,#1E6FD9)}
.enterBtn,.fab,.recBig:not(.rec){animation:gflow 7s ease infinite!important;background:linear-gradient(120deg,#5BC0F8,#1E6FD9,#2EC4B6,#5BC0F8)!important;background-size:300% 300%!important}
X

{ar:"«الصبر يُناضل الحِدْثان، والجزع من أعوان الزمان»",en:"“Patience wrestles with misfortunes, while despair is one of time's helpers.”",wa:"الإمام علي (ع)",we:"Imam Ali (as)",sa:"نهج البلاغة",se:"Nahj al-Balagha"},

{ar:"«الصبر رأس الإيمان»",en:"“Patience is the head of faith.”",wa:"الإمام جعفر الصادق (ع)",we:"Imam Ja'far al-Sadiq (as)",sa:"الكافي",se:"al-Kafi"},
{ar:"«الصبر من الإيمان بمنزلة الرأس من الجسد، فإذا ذهب الرأس ذهب الجسد، كذلك إذا ذهب الصبر ذهب الإيمان»",en:"“Patience is to faith as the head is to the body: when the head is gone the body is gone, and when patience is gone faith is gone.”",wa:"الإمام جعفر الصادق (ع)",we:"Imam Ja'far al-Sadiq (as)",sa:"الكافي",se:"al-Kafi"},

function md(s){ // tiny safe markdown
  s=esc(s||"");
  const lines=s.split(/\n/);let out="",inL=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    if(/^\s*#{1,4}\s+/.test(l)){if(inL){out+="</ul>";inL=false}out+="<h4>"+l.replace(/^\s*#{1,4}\s+/,"")+"</h4>";continue}
    if(/^\s*[-•*]\s+/.test(l)){if(!inL){out+="<ul>";inL=true}out+="<li>"+l.replace(/^\s*[-•*]\s+/,"")+"</li>";continue}
    if(inL){out+="</ul>";inL=false}
    if(l.trim())out+="<p>"+l+"</p>";
  }
  if(inL)out+="</ul>";return out;
}

const LS={get(k,d){try{return JSON.parse(localStorage.getItem("fat_"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("fat_"+k,JSON.stringify(v))}catch(e){}}};
async function put(col,id,data){
  data={...data,updatedAt:Date.now()};
  if(S.mode=="db"&&DB){await DB.collection(col).doc(id).set(data);}
  else{const arr=LS.get(col,[]).filter(x=>x.id!==id);arr.push({id,...data});LS.set(col,arr);loadLocal();}
}
async function del(col,id){
  if(S.mode=="db"&&DB){await DB.collection(col).doc(id).delete();}
  else{LS.set(col,LS.get(col,[]).filter(x=>x.id!==id));loadLocal();}
}
function loadLocal(){S.events=LS.get("events",[]);S.labs=LS.get("labs",[]);S.daily=LS.get("daily",[]);const c=LS.get("chats",[]).find(x=>x.id=="main");S.chat=c?c.messages:[];LS.get("meta",[]).forEach(m=>S.meta[m.id]=m);["events","labs","daily","meta"].forEach(schedule)}
function subscribe(){
  const map={events:"events",labs:"labs",daily:"daily"};
  let pending=4;const timer=setTimeout(()=>{if(!S.ready)toast(t("offline"))},10000);
  const done=()=>{if(--pending<=0){S.ready=true;clearTimeout(timer)}};
  for(const [col,key] of Object.entries(map)){
    let first=true;
    let sig="";
    DB.collection(col).onSnapshot(snap=>{if(first&&!snap.metadata.fromCache){first=false;done()}const arr=snap.docs.map(d=>({id:d.id,...d.data()}));const s=JSON.stringify(arr);if(s===sig)return;sig=s;S[key]=arr;schedule(key)},e=>{done()});
  }
  let f2=true;
  let msig="",csig="";
  DB.collection("meta").onSnapshot(snap=>{if(f2&&!snap.metadata.fromCache){f2=false;done()}const m={};snap.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});const s=JSON.stringify(m);if(s===msig)return;msig=s;S.meta=m;schedule("meta")},()=>done());
  DB.doc("chats/main").onSnapshot(d=>{const c=(d.exists&&d.data().messages)||[];const s=JSON.stringify(c);if(s===csig||busy)return;csig=s;S.chat=c;if($("#chat").classList.contains("on"))renderChat()},()=>{});
}

async function shrink(blob,max=1600){
  const img=await createImageBitmap(blob);const s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
}
let pdfReady=null;
function loadPdf(){if(pdfReady)return pdfReady;pdfReady=new Promise((res,rej)=>{const a=document.createElement("script");a.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";a.onload=()=>{const b=document.createElement("script");b.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";b.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc=a.src}catch(e){}res(window.pdfjsLib)};b.onerror=rej;document.head.appendChild(b)};a.onerror=rej;document.head.appendChild(a)});return pdfReady}
async function pdfToImages(file){
  const lib=await loadPdf();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  for(let i=1;i<=Math.min(doc.numPages,4);i++){const p=await doc.getPage(i);const vp=p.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.82)))}
  return out;
}
async function handleFiles(fs){
  const stored=[],images=[];
  for(const f of fs){
    const kind=f.type.startsWith("image")?"image":f.type.startsWith("audio")?"audio":f.type=="application/pdf"?"pdf":"file";
    let up=f;
    if(kind=="image"){try{up=await shrink(f);images.push(up)}catch(e){images.push(f)}}
    if(kind=="pdf"){toast(t("pdfRead"));try{images.push(...await pdfToImages(f))}catch(e){console.warn(e)}}
    if(ASSETS){try{toast(t("fileUp"));const r=await ASSETS.upload(up);stored.push({kind,url:r.url,id:r.id,name:f.name})}catch(e){console.warn("asset",e);toast((LANG=="ar"?"ما قدر يرفع: ":"Couldn't upload: ")+f.name)}}
  }
  return {stored,images};
}

function profileText(){const c=S.meta.ctx;if(!c||!c.text)return"";return `${c.text}
Today: ${todayISO()}, ${Math.floor((new Date()-BIRTH)/864e5)} days old.`}
function contextText(maxEv=30){
  const ev=sortedEvents().slice(0,maxEv).reverse().map(e=>`- ${e.date}${e.time?" "+e.time:""} [${e.type}] ${e.title_en||e.title_ar||""}: ${(e.summary_en||e.summary_ar||"").slice(0,500)}`).join("\n");
  const labs=[...S.labs].sort((a,b)=>a.date.localeCompare(b.date)).map(l=>`${l.date} ${l.key}=${l.value}${l.unit?" "+l.unit:""}`).join("; ");
  const days=[...S.daily].sort((a,b)=>b.id.localeCompare(a.id)).slice(0,7).map(d=>`${d.id}: temp ${d.temp||"?"}, feeds ${d.feeds||"?"} (${d.feed!=null?T.en.feedOpts[d.feed]:"?"}), wet ${d.wet||"?"}, stools ${d.dirty||"?"}, legs ${d.legs!=null?T.en.legsOpts[d.legs]:"?"}, sleep ${d.sleep!=null?T.en.sleepOpts[d.sleep]:"?"}, mood ${d.mood!=null?T.en.moodOpts[d.mood]:"?"}, vomiting ${d.vomit==1?"yes":"no/?"}. Notes: ${d.notes||"-"}`).join("\n");
  return `${profileText()}\n\nTIMELINE:\n${ev||"(none)"}\n\nLABS: ${labs||"(none)"}\n\nDIARY (last 7 days):\n${days||"(none)"}`;
}
async function analyzeRecord(rec,images){
  const prompt=`You are a careful pediatric-oncology medical explainer helping a Lebanese family track their infant daughter. Read the new record below (report images may be attached) and return JSON only.

${contextText(20)}

NEW RECORD:
type: ${rec.type}; date entered: ${rec.date} ${rec.time||""}; title given: ${rec.title_ar||rec.title_en||"-"}; doctor: ${rec.doctor||"-"}
text/notes/transcript:
${(rec.transcript||"(none)").slice(0,12000)}
${rec.type=="treatment"||rec.type=="procedure"?`treatment kind: ${rec.kind}; cycle: ${rec.cycle}; side effects: ${rec.sideEffects}; action: ${rec.action}`:""}

Return exactly this JSON:
{"date":"YYYY-MM-DD (exam/visit date read from the report if visible, else the entered date)","time":"HH:MM or empty","type":"scan|lab|visit|treatment|procedure|milestone|note","title_ar":"short Arabic title","title_en":"short English title","summary_ar":"clear summary in Lebanese Arabic, 3-6 bullet lines starting with '- '","summary_en":"same in English","analysis_ar":"your analysis in Lebanese Arabic: what it means for her, comparison with previous results, what to watch, and 2-3 questions for the doctor. Use '- ' bullets. Never give dosing or change treatment; urge contacting the team for any red flag.","analysis_en":"same in English","transcript":"if images contain a report, the full English text of the report as written; otherwise empty","labs":[{"key":"creatinine|wbc|hb|plt|anc|weight|other_name","value":0,"unit":"","date":"YYYY-MM-DD"}]}`;
  const opts={modelTier:"complex"};if(images&&images.length)opts.images=images.slice(0,8);
  const r=await SAMPLE.json(prompt,opts);
  const out={};["date","time","type","title_ar","title_en","summary_ar","summary_en","analysis_ar","analysis_en"].forEach(k=>{if(r&&r[k])out[k]=r[k]});
  if(r&&r.transcript&&!rec.transcript)out.transcript=r.transcript;
  if(r&&Array.isArray(r.labs))out._labs=r.labs.filter(l=>l&&l.key&&l.value!==undefined&&l.value!==null&&l.value!=="");
  if(!Object.keys(TYPE_COLOR).includes(out.type))delete out.type;
  return out;
}

let SB=null;
const LG={
ar:{title:"تسجيل الدخول",sub:"خاص بالعائلة",email:"البريد الإلكتروني",pass:"كلمة السر",btn:"دخول",wait:"عم يدخّل…",err:"البريد أو كلمة السر غلط.",out:"تسجيل الخروج"},

/* documents stored as JSON rows in one table: records(collection, id, data) */
function makeDB(sb){
  const loaders={};
  const reg=(c,fn)=>{(loaders[c]=loaders[c]||new Set()).add(fn);return()=>loaders[c].delete(fn)};
  const kick=c=>{(loaders[c]||[]).forEach(f=>f())};
  const live=(c,fn)=>{
    const ch=sb.channel("rt-"+c+"-"+Math.random().toString(36).slice(2))
      .on("postgres_changes",{event:"*",schema:"public",table:"records",filter:"collection=eq."+c},()=>fn())
      .subscribe();
    return()=>sb.removeChannel(ch);
  };
  return {
    collection(c){return{
      doc(id){return{
        async set(data){const {error}=await sb.from("records").upsert({collection:c,id,data,updated_at:new Date().toISOString()});if(error)throw error;kick(c)},
        async delete(){const {error}=await sb.from("records").delete().eq("collection",c).eq("id",id);if(error)throw error;kick(c)}
      }},
      onSnapshot(cb,err){
        const load=async()=>{
          const {data,error}=await sb.from("records").select("id,data").eq("collection",c);
          if(error){err&&err(error);return}
          cb({metadata:{fromCache:false},docs:data.map(r=>({id:r.id,data:()=>r.data}))});
        };
        load();const a=reg(c,load),b=live(c,load);return()=>{a();b()};
      }
    }},
    doc(path){const [c,id]=path.split("/");return{
      onSnapshot(cb,err){
        const load=async()=>{
          const {data,error}=await sb.from("records").select("data").eq("collection",c).eq("id",id).maybeSingle();
          if(error){err&&err(error);return}
          cb({exists:!!data,data:()=>data?data.data:{}});
        };
        load();const a=reg(c,load),b=live(c,load);return()=>{a();b()};
      }
    }}
  };
}

/* files go to a private Storage bucket "files"; the app keeps a long-lived signed link */
function makeAssets(sb){
  return {upload:async blob=>{
    const nameExt=blob.name&&blob.name.includes(".")?blob.name.split(".").pop():"";
    const typeExt=((blob.type||"").split("/")[1]||"").split(";")[0].replace("jpeg","jpg").replace("mpeg","mp3").replace("x-m4a","m4a");
    const ext=(nameExt||typeExt||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"bin";
    const path=(crypto.randomUUID?crypto.randomUUID():uid()+uid())+"."+ext;
    const up=await sb.storage.from("files").upload(path,blob,{contentType:blob.type||"application/octet-stream"});
    if(up.error)throw up.error;
    let r=await sb.storage.from("files").createSignedUrl(path,315360000);
    if(r.error)r=await sb.storage.from("files").createSignedUrl(path,31536000);
    if(r.error)throw r.error;
    return {url:r.data.signedUrl,id:path};
  }};
}

/* Claude, through the "ai" edge function (the API key never reaches the browser) */
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({media_type:b.type||"image/jpeg",data:String(r.result).split(",")[1]});r.onerror=rej;r.readAsDataURL(b)})}
function makeSample(sb){
  const call=async(messages,opts={})=>{
    const images=opts.images&&opts.images.length?await Promise.all(opts.images.map(blobToB64)):[];
    const {data,error}=await sb.functions.invoke("ai",{body:{messages,images}});
    if(error)throw error;
    if(data&&data.error)throw new Error(data.error);
    const text=(data&&data.text)||"";
    if(opts.onText)opts.onText({text});
    return {text};
  };
  const s=(hist,opts)=>call(hist,opts);
  s.json=async(prompt,opts)=>{
    const r=await call([{role:"user",content:prompt}],opts);
    const m=r.text.match(/\{[\s\S]*\}/);if(!m)throw new Error("no json");
    return JSON.parse(m[0]);
  };
  return s;
}

/* live dictation with the browser's speech recognition (Chrome, Edge, Safari) */
function makeDict(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,want=false,fin=()=>{},st=()=>{};
  return {
    start(){return new Promise((res,rej)=>{
      rec=new SR();rec.lang=LANG==="en"?"en-US":"ar-LB";rec.continuous=true;rec.interimResults=false;want=true;
      rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin({text:e.results[i][0].transcript.trim()})}};
      rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){want=false;rej(e)}};
      rec.onend=()=>{if(want){try{rec.start();return}catch(x){}}st({state:"idle"})};
      try{rec.start();res()}catch(e){rej(e)}
    })},
    stop(){want=false;try{rec&&rec.stop()}catch(e){}return Promise.resolve()},
    onFinal(cb){fin=cb},onState(cb){st=cb}
  };
}
